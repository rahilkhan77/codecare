<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account — CodeCare</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/theme.css?v=20261030-theme-5"><link rel="stylesheet" href="/pages.css?v=20261030-theme-5"><link rel="stylesheet" href="/workspace/workspace.css">
  <script>try{const theme=localStorage.getItem('codecare-theme');if(theme==='dark'||theme==='light')document.documentElement.dataset.theme=theme;}catch{}</script>
</head>
<body class="workspace-page">
  <header class="site-header"><a class="wordmark" href="/" aria-label="CodeCare home"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>codecare</span></a>
    <nav class="main-nav" aria-label="Main navigation"><a href="/#product">Product</a><a href="/how-it-works/">How it works</a><a href="/pricing/">Pricing</a><a href="/about/">About</a><a href="/contact/">Contact</a></nav>
    <a class="header-cta" href="/workspace/login.html">Sign in</a>
    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark theme" aria-pressed="false"><svg class="theme-icon theme-icon-moon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.2 15.2A8.5 8.5 0 0 1 8.8 3.8 8.5 8.5 0 1 0 20.2 15.2Z"/></svg><svg class="theme-icon theme-icon-sun" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg><span data-theme-label>Dark</span></button>
    <button class="menu-toggle" aria-label="Open navigation" aria-expanded="false"><span></span><span></span></button>
  </header>
  <main class="auth-shell">
    <p class="page-kicker"><span class="eyebrow-dot"></span> WORKSPACE</p>
    <h1>Create your workspace</h1>
    <p>This creates a CodeCare account. Connecting GitHub is a separate, explicit step.</p>
    <form id="register-form">
      <label for="full_name">Name</label>
      <input id="full_name" name="full_name" required minlength="1" autocomplete="name">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required autocomplete="email">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" required minlength="10" autocomplete="new-password">
      <button class="button button-dark" type="submit">Create account <span>↗</span></button>
    </form>
    <p class="auth-status" id="status" role="status"></p>
    <p>Already registered? <a class="text-link" href="/workspace/login.html">Sign in</a></p>
  </main>
  <script src="/app.js?v=20261030-theme-5" defer></script>
  <script src="/workspace/workspace.js" defer></script>
</body>
</html>
