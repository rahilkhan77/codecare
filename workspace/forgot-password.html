<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Reset a CodeCare password.">
  <meta property="og:url" content="https://codecare.si/workspace/forgot-password.html">
  <meta property="og:image" content="https://codecare.si/og-image.svg">
  <link rel="canonical" href="https://codecare.si/workspace/forgot-password.html">
  <title>Forgot password — CodeCare</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/theme.css?v=20261030-theme-5"><link rel="stylesheet" href="/pages.css?v=20261030-theme-5"><link rel="stylesheet" href="/workspace/workspace.css">
  <script>try{const theme=localStorage.getItem('codecare-theme');document.documentElement.dataset.theme=(theme==='light'||theme==='dark')?theme:'dark';}catch(e){document.documentElement.dataset.theme='dark';}</script>
</head>
<body class="workspace-page" data-page="forgot">
  <header class="site-header"><a class="wordmark" href="/" aria-label="CodeCare home"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>codecare</span></a>
    <nav class="main-nav" aria-label="Main navigation"><a href="/#product">Product</a><a href="/how-it-works/">How it works</a><a href="/pricing/">Pricing</a><a href="/about/">About</a><a href="/contact/">Contact</a></nav>
    <a class="header-cta" href="/workspace/login.html">Sign in</a>
    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to light theme" aria-pressed="true"><svg class="theme-icon theme-icon-moon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.2 15.2A8.5 8.5 0 0 1 8.8 3.8 8.5 8.5 0 1 0 20.2 15.2Z"/></svg><svg class="theme-icon theme-icon-sun" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg><span data-theme-label>Light</span></button>
    <button class="menu-toggle" aria-label="Open navigation" aria-expanded="false"><span></span><span></span></button>
  </header>
  <main class="auth-layout">
    <section class="auth-aside">
      <p class="page-kicker"><span class="eyebrow-dot"></span> ACCOUNT</p>
      <h1>Reset your password</h1>
      <p>We will send a reset link if that email belongs to an account and mail delivery is available. The response does not reveal whether the address is registered.</p>
    </section>
    <section class="auth-shell">
      <form id="forgot-form">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required autocomplete="email">
        <button class="button button-dark" type="submit">Send reset link <span>↗</span></button>
      </form>
      <p class="auth-status" id="status" role="status" aria-live="polite"></p>
      <p><a class="text-link" href="/workspace/login.html">Back to sign in</a></p>
    </section>
  </main>
  <script src="/app.js?v=20261030-theme-5" defer></script>
  <script src="/workspace/workspace.js" defer></script>
</body>
</html>
