services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: codecare
      POSTGRES_PASSWORD: codecare
      POSTGRES_DB: codecare
    ports:
      - "5432:5432"
    volumes:
      - codecare_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codecare"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://codecare:codecare@postgres:5432/codecare
      REDIS_URL: redis://redis:6379/0
      CODECARE_DISABLE_WORKER: "1"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 15s
      timeout: 5s
      retries: 8
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: python -m codecare.worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://codecare:codecare@postgres:5432/codecare
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  codecare_pg:
