<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="canonical" href="https://codecare.si/workspace/"><meta property="og:url" content="https://codecare.si/workspace/"><title>Workspace — CodeCare</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/theme.css?v=20261030-theme-5"><link rel="stylesheet" href="/pages.css?v=20261030-theme-5"><link rel="stylesheet" href="/workspace/workspace.css">
  <script>try{const theme=localStorage.getItem('codecare-theme');document.documentElement.dataset.theme=(theme==='light'||theme==='dark')?theme:'dark';}catch(e){document.documentElement.dataset.theme='dark';}</script>
</head>
<body class="workspace-page" data-page="app">
  <header class="site-header"><a class="wordmark" href="/" aria-label="CodeCare home"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>codecare</span></a>
    <nav class="main-nav" aria-label="Main navigation"><a href="/#product">Product</a><a href="/how-it-works/">How it works</a><a href="/pricing/">Pricing</a><a href="/workspace/">Workspace</a><a href="/contact/">Contact</a></nav>
    <button class="header-cta" type="button" id="logout-btn">Sign out</button>
    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to light theme" aria-pressed="true"><svg class="theme-icon theme-icon-moon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.2 15.2A8.5 8.5 0 0 1 8.8 3.8 8.5 8.5 0 1 0 20.2 15.2Z"/></svg><svg class="theme-icon theme-icon-sun" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg><span data-theme-label>Light</span></button>
    <button class="menu-toggle" aria-label="Open navigation" aria-expanded="false"><span></span><span></span></button>
  </header>
  <div class="app-frame">
    <div class="dashboard-shell" aria-label="CodeCare workspace">
      <div class="dashboard-topbar">
        <div class="dashboard-brand"><span class="mini-mark"><i></i><i></i><i></i><i></i></span><span>codecare</span><span class="workspace-label">WORKSPACE</span></div>
        <div class="dashboard-controls"><span class="sync" id="sync-pill"><i></i> Checking…</span><button class="avatar" id="avatar" type="button" aria-label="Account">•</button></div>
      </div>
      <div class="dashboard-layout">
        <aside class="dash-sidebar">
          <div class="workspace-switch"><span class="workspace-icon" id="org-mark">C</span><span><b id="org-name">Workspace</b><small id="plan-label">Plan unknown</small></span></div>
          <div class="side-label">WORKSPACE</div>
          <button class="side-item selected" data-view="overview" type="button"><span class="side-glyph">◫</span> Overview</button>
          <button class="side-item" data-view="repos" type="button"><span class="side-glyph">⌘</span> Repositories</button>
          <button class="side-item" data-view="issues" type="button"><span class="side-glyph">⌁</span> Maintenance</button>
          <button class="side-item" data-view="prs" type="button"><span class="side-glyph">↗</span> Pull requests</button>
          <div class="side-label side-label-spaced">SETTINGS</div>
          <button class="side-item" data-view="integrations" type="button"><span class="side-glyph">⚙</span> Integrations</button>
          <button class="side-item" data-view="report" type="button"><span class="side-glyph">▤</span> Monthly report</button>
          <button class="side-item" data-view="billing" type="button"><span class="side-glyph">◉</span> Billing</button>
          <button class="side-item" data-view="account" type="button"><span class="side-glyph">⚙</span> Account</button>
        </aside>
        <div class="dash-main" id="view-root"><p class="empty-state">Loading workspace…</p></div>
      </div>
    </div>
  </div>
  <script src="/app.js?v=20261030-theme-5" defer></script>
  <script src="/workspace/workspace.js" defer></script>
</body>
</html>
