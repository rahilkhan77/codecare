name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: python -m pip install -r backend/requirements.txt ruff
      - name: Lint
        run: ruff check backend
      - name: Test
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: pytest -q
      - name: Dependency audit
        run: python -m pip install pip-audit && python -m pip_audit -r backend/requirements.txt --disable-pip --no-deps --progress-spinner off

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f backend/Dockerfile -t codecare-api:ci .
      - name: Build sandbox image
        run: docker build -f sandbox/Dockerfile -t codecare-sandbox:ci sandbox
